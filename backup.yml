bundle:
  name: bigdata-etl

workspace:
  root_path: /Shared/${bundle.name}

variables:
  # Definición de variables globales
  cluster_version:
    default: "14.3.x-scala2.12"
  node_type_id:
    default: "Standard_DS3_v2"
  num_workers:
    default: 1
  workspace_host:
    default: ""

targets:
  dev:
    workspace:
      root_path: /Shared/Github/dev
    variables:
      num_workers: 1
  prod:
    workspace:
      root_path: /Shared/Github/prod
    variables:
      num_workers: 2 # Ejemplo: más potencia en producción

resources:
  jobs:
    etl_job:
      name: ${bundle.name}_ETL_Job
      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: ${var.cluster_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}
      tasks:
        - task_key: run_etl
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ./notebooks/HolaMundo.ipynb